<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Technical Documentation Report</title>
  <!-- GitHub Markdown CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

  <!-- Core Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.8.0/dist/mermaid.min.js"></script>

  <style>
    @page {
      size: A4;
      margin: 18mm 15mm 18mm 15mm;
    }

    body {
      background-color: #ffffff;
      color: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .markdown-body {
      box-sizing: border-box;
      max-width: 100%;
      margin: 0 auto;
      font-size: 13.5px;
      line-height: 1.6;
      color: #1f2328;
    }

    /* Typography */
    .markdown-body h1 {
      font-size: 24px;
      border-bottom: 2px solid #d0d7de;
      padding-bottom: 8px;
      margin-top: 10px;
      margin-bottom: 16px;
      color: #1f2328;
      page-break-after: avoid;
      break-after: avoid;
    }
    .markdown-body h2 {
      font-size: 18px;
      border-bottom: 1px solid #d8dee4;
      padding-bottom: 6px;
      margin-top: 26px;
      margin-bottom: 12px;
      color: #1f2328;
      page-break-after: avoid;
      break-after: avoid;
    }
    .markdown-body h3 {
      font-size: 15px;
      margin-top: 20px;
      margin-bottom: 8px;
      color: #1f2328;
      page-break-after: avoid;
      break-after: avoid;
    }
    .markdown-body h4 {
      font-size: 13.5px;
      margin-top: 14px;
      margin-bottom: 6px;
      page-break-after: avoid;
      break-after: avoid;
    }

    /* Tables */
    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 14px 0;
      display: table !important;
      page-break-inside: avoid;
      break-inside: avoid;
      font-size: 12.5px;
    }
    .markdown-body table th {
      background-color: #f6f8fa;
      font-weight: 600;
      border: 1px solid #d0d7de;
      padding: 7px 11px;
      text-align: left;
    }
    .markdown-body table td {
      border: 1px solid #d0d7de;
      padding: 6px 11px;
      vertical-align: middle;
    }
    .markdown-body table tr:nth-child(2n) {
      background-color: #fcfdfd;
    }

    /* Code blocks */
    .markdown-body pre {
      background-color: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.45;
      overflow-x: auto;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .markdown-body code {
      background-color: rgba(175, 184, 193, 0.2);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-size: 85%;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .markdown-body pre code {
      background-color: transparent;
      padding: 0;
      font-size: 100%;
    }

    /* Links */
    .markdown-body a {
      color: #0969da;
      text-decoration: none;
    }
    .markdown-body a:hover {
      text-decoration: underline;
    }

    /* Math display */
    .katex-display-target {
      margin: 12px 0;
      padding: 4px 0;
      text-align: center;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .katex {
      font-size: 1.05em !important;
    }

    /* Mermaid diagrams */
    .mermaid-container {
      margin: 18px 0;
      padding: 14px;
      background: #fafbfc;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .mermaid-container svg {
      max-width: 100%;
      height: auto;
    }

    /* GitHub-style Alerts */
    .markdown-alert {
      border-left: 4px solid;
      padding: 10px 14px;
      margin: 14px 0;
      border-radius: 0 6px 6px 0;
      page-break-inside: avoid;
      break-inside: avoid;
      font-size: 13px;
    }
    .markdown-alert .alert-title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .markdown-alert-note {
      border-color: #0969da;
      background-color: #f0f7ff;
    }
    .markdown-alert-note .alert-title {
      color: #0969da;
    }
    .markdown-alert-tip {
      border-color: #1a7f37;
      background-color: #f0fdf4;
    }
    .markdown-alert-tip .alert-title {
      color: #1a7f37;
    }
    .markdown-alert-important {
      border-color: #8250df;
      background-color: #fbf5ff;
    }
    .markdown-alert-important .alert-title {
      color: #8250df;
    }
    .markdown-alert-warning {
      border-color: #9a6700;
      background-color: #fffbeb;
    }
    .markdown-alert-warning .alert-title {
      color: #9a6700;
    }
    .markdown-alert-caution {
      border-color: #cf222e;
      background-color: #fff1f0;
    }
    .markdown-alert-caution .alert-title {
      color: #cf222e;
    }

    @media print {
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .markdown-body {
        color: #000000;
      }
    }
  </style>
</head>

      // Decode base64 utf-8 safely
      const binStr = atob(b64);
      const bytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) {
        bytes[i] = binStr.charCodeAt(i);
      }
      const decoder = new TextDecoder('utf-8');
      const markdown = decoder.decode(bytes);

      // 1. Render Markdown to HTML via marked.js
      marked.use({
        gfm: true,
        breaks: false
      });
      const html = marked.parse(markdown);
      const container = document.getElementById('app');
      container.innerHTML = html;

      // 2. Render all KaTeX Math Formulas
      document.querySelectorAll('.katex-display-target').forEach(el => {
        const latex = atob(el.getAttribute('data-math'));
        try {
          katex.render(latex, el, { displayMode: true, throwOnError: false });
        } catch (e) {
          el.innerHTML = `<span style="color:red">[Formula Error: ${latex}]</span>`;
        }
      });

      document.querySelectorAll('.katex-inline-target').forEach(el => {
        const latex = atob(el.getAttribute('data-math'));
        try {
          katex.render(latex, el, { displayMode: false, throwOnError: false });
        } catch (e) {
          el.innerHTML = `<span style="color:red">[Formula Error: ${latex}]</span>`;
        }
      });

      // 3. Render GitHub Alerts
      document.querySelectorAll('blockquote').forEach(bq => {
        const text = bq.innerHTML.trim();
        const m = text.match(/^<p>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(?:<br\s*\/?>|\n)?([\s\S]*)<\/p>$/i);
        if (m) {
          const type = m[1].toLowerCase();
          const content = m[2];
          const div = document.createElement('div');
          div.className = `markdown-alert markdown-alert-${type}`;
          div.innerHTML = `
            <div class="alert-title">
              ${alertIcons[type] || ''}
              <span>${type.charAt(0).toUpperCase() + type.slice(1)}</span>
            </div>
            <div class="alert-content"><p>${content}</p></div>
          `;
          bq.replaceWith(div);
        }
      });

      // 4. Render Mermaid Flowcharts
      const mermaidBlocks = container.querySelectorAll('pre code.language-mermaid');
      for (let i = 0; i < mermaidBlocks.length; i++) {
        const codeEl = mermaidBlocks[i];
        const preEl = codeEl.parentElement;
        const code = codeEl.textContent;
        const div = document.createElement('div');
        div.className = 'mermaid-container';
        try {
          const id = 'mermaid-chart-' + i;
          const { svg } = await mermaid.render(id, code);
          div.innerHTML = svg;
          preEl.replaceWith(div);
        } catch (e) {
          console.error("Mermaid render error:", e);
        }
      }

      // Mark page as ready for PDF capture
      document.body.setAttribute('data-rendered', 'true');
